<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HUGU Servis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body { font-family: 'Inter', sans-serif; background: #0d1117; color: #e5eefb; margin: 0; }
      .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
      .brand { font-weight: 700; letter-spacing: 0.04em; }
      .panel { background: #151b24; border: 1px solid #273244; border-radius: 18px; padding: 24px; box-shadow: 0 24px 50px rgba(0, 0, 0, 0.22); }
      .grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 24px; }
      .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
      label { font-size: 0.92rem; color: #bfcfe8; }
      input, select, textarea, button { font: inherit; }
      input, select, textarea {
        width: 100%;
        border-radius: 12px;
        border: 1px solid #334155;
        background: #0f1723;
        color: #edf3ff;
        padding: 12px 14px;
        box-sizing: border-box;
      }
      textarea { min-height: 110px; resize: vertical; }
      button { border: none; border-radius: 12px; cursor: pointer; }
      .primary { background: linear-gradient(135deg, #22c55e, #16a34a); color: #081109; font-weight: 700; padding: 12px 18px; }
      .secondary { background: #243447; color: #edf3ff; font-weight: 600; padding: 12px 18px; }
      .inline { display: flex; gap: 12px; }
      .status { display: inline-flex; align-items: center; background: #162534; color: #d9f1ff; border-radius: 999px; padding: 6px 10px; font-size: 0.8rem; }
      .meta { color: #a7bbd3; font-size: 0.85rem; }
      .results { margin-top: 24px; }
      .result-card { background: #151b24; border: 1px solid #2b374d; border-radius: 18px; padding: 20px; }
      .muted { color: #a9bad5; }
      @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">HUGU SERVIS</div>
        <a href="/admin" class="secondary" style="text-decoration: none; display: inline-block;">Admin panel</a>
      </header>

      <main class="grid">
        <section class="panel">
          <h2>Yeni müraciət</h2>
          <form id="request-form">
            <div class="field">
              <label for="customer_name">Ad Soyad</label>
              <input id="customer_name" name="customer_name" type="text" required placeholder="Məs: Elvin Məmmədov" />
            </div>

            <div class="field">
              <label for="customer_phone">Telefon</label>
              <input id="customer_phone" name="customer_phone" type="tel" required placeholder="050 123 45 67" />
            </div>

            <div class="field">
              <label for="service_name">Xidmət</label>
              <select id="service_name" name="service_name" required></select>
            </div>

            <div class="field">
              <label for="device_info">Cihaz haqqında məlumat</label>
              <input id="device_info" name="device_info" type="text" placeholder="Məs: Lenovo ThinkPad, 8GB RAM" />
            </div>

            <button type="submit" class="primary" style="width: 100%;">Müraciəti göndər</button>
            <div id="request-message" class="meta" style="margin-top: 12px;"></div>
          </form>
        </section>

        <section class="panel">
          <h2>Sifarişimi izlə</h2>
          <form id="track-form">
            <div class="field">
              <label for="tracking_code">İzləmə kodu</label>
              <input id="tracking_code" type="text" placeholder="HG-ABCD12" required />
            </div>
            <button type="submit" class="secondary" style="width: 100%;">Axtar</button>
          </form>

          <div id="tracking-result" class="results" style="display: none;">
            <div class="result-card">
              <div class="inline" style="justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <div>
                  <div style="font-weight: 700; font-size: 1.1rem;" id="result-service">-</div>
                  <div class="meta" id="result-device">-</div>
                </div>
                <span class="status" id="result-status">-</span>
              </div>

              <div class="meta" style="margin-bottom: 8px;">Yaradılma: <span id="result-created">-</span></div>
              <div class="meta" style="margin-bottom: 8px;">Status yenilənmə: <span id="result-updated">-</span></div>
              <div class="meta" style="margin-bottom: 8px;">Təklif olunan qiymət: <span id="result-quoted">-</span></div>
              <div class="meta" style="margin-bottom: 8px;">Son qiymət: <span id="result-final">-</span></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
